<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#FDFBF7"/><text x="72" y="92" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#2F3433">VILLAGE FOR HER</text><rect x="72" y="118" width="160" height="8" rx="4" fill="#E8B4A0"/><text x="72" y="220" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#E8B4A0">A BETTER WAY TO HELP</text><text x="72" y="330" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="700" fill="#2F3433"><tspan x="72" dy="0">“Let me know if you</tspan><tspan x="72" dy="76">need anything” can still</tspan><tspan x="72" dy="76">leave her with one</tspan><tspan x="72" dy="76">more job.</tspan></text><text x="72" y="720" font-family="Inter,Arial,sans-serif" font-size="36" fill="#6B706E"><tspan x="72" dy="0">Specific help removes decisions.</tspan><tspan x="72" dy="52">And sometimes that is the most</tspan><tspan x="72" dy="52">helpful part.</tspan></text><rect x="72" y="1180" width="936" height="96" rx="28" fill="#E8B4A0"/><text x="540" y="1242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#FDFBF7">SAVE + SHARE</text></svg>